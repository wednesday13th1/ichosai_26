<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070706">
  <meta name="description" content="スマートフォンを360°動かして発見するWonderland WebAR photo experience.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
  <title>Wonderland — A New Perspective</title>
</head>
<body>
<main id="experience">
  <video id="camera" autoplay muted playsinline aria-hidden="true"></video>
  <div id="ar-layer" aria-hidden="true"></div>
  <section id="landing" aria-labelledby="landing-title">
    <p class="masthead">WONDERLAND <span>/ A NEW PERSPECTIVE</span></p>
    <div class="landing-copy"><p>STEP INTO</p><h1 id="landing-title">WONDERLAND</h1><p class="directions">Turn around.<br>Look above you.<br>Look beneath you.</p><p class="japanese">周りすべてが、<br>Wonderlandになる。</p></div>
    <button id="enter" type="button">ENTER WONDERLAND <span aria-hidden="true">→</span></button>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <section id="scene-select" hidden aria-labelledby="choose-title">
    <header><p>CHOOSE YOUR</p><h2 id="choose-title">WONDERLAND</h2></header>
    <div class="scene-list">
      <button data-scene="clock"><small>01</small><strong>CLOCK</strong><span>→</span></button>
      <button data-scene="cards"><small>02</small><strong>CARDS</strong><i aria-hidden="true">♥</i><span>→</span></button>
      <button data-scene="chess"><small>03</small><strong>CHESS</strong><span>→</span></button>
      <button data-scene="tea-party"><small>04</small><strong>TEA PARTY</strong><span>→</span></button>
    </div>
  </section>
  <div id="hud" hidden>
    <p id="scene-label"><small>01 /</small> CLOCK</p>
    <button id="exit" type="button" aria-label="シーン選択へ戻る">×</button>
    <div id="look-guide" aria-live="polite"><strong>LOOK AROUND</strong><pre>  ↑
←   →
  ↓</pre></div>
    <button id="shutter" type="button" aria-label="写真を撮る"><span></span></button>
  </div>
  <div id="flash" aria-hidden="true"></div>
  <section id="photo-preview" hidden aria-label="撮影した写真のプレビュー"><img id="captured-photo" alt="撮影したWonderland写真"><div><button id="retake" type="button">RETAKE</button><button id="save-photo" type="button">SAVE / SHARE</button></div></section>
</main>
<script type="module" src="/js/main.js"></script>
</body>
</html>
